services:
  db:
    image: postgres:16
    container_name: nyc-tlc-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nyc_tlc}
      POSTGRES_USER: ${DATABASE_USER:-nyc_tlc}
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-local_dev_password}"
    ports:
      - "127.0.0.1:${PORT:-5432}:5432"
    volumes:
      - nyc_tlc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nyc_tlc} -d ${DATABASE_NAME:-nyc_tlc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  nyc_tlc_postgres_data:
